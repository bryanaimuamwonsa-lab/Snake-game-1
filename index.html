<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Presido Snake</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#020713;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.screen{
  display:none;
  width:100%;
  min-height:100vh;
  padding:15px;
  justify-content:center;
  align-items:center;
}

.screen.active{
  display:flex;
}

.panel{
  width:100%;
  max-width:650px;
  padding:25px;
  text-align:center;
  background:linear-gradient(145deg,#061a32,#020712);
  border:2px solid #168cff;
  border-radius:20px;
  box-shadow:0 0 30px #0077ff55;
}

h1{
  color:#40b8ff;
  text-shadow:0 0 15px #008cff;
}

h2{
  color:#40b8ff;
}

button{
  display:block;
  width:100%;
  max-width:400px;
  margin:10px auto;
  padding:15px;
  border:2px solid #168cff;
  border-radius:12px;
  background:#071a32;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.95);
  background:#0e4778;
}

#gameScreen{
  flex-direction:column;
  padding:5px;
}

.gameTop{
  width:100%;
  max-width:700px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:4px;
  margin-bottom:5px;
}

.gameTop span{
  font-size:13px;
  font-weight:bold;
}

#pauseBtn{
  width:auto;
  margin:0;
  padding:8px 12px;
}

#gameCanvas{
  width:min(96vw,700px);
  height:auto;
  display:block;
  border:3px solid #168cff;
  border-radius:12px;
